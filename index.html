<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Tecno-Game Deluxe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #030712;
            color: #f8fafc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-wrapper {
            position: relative;
            border: 3px solid #00f0ff;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
            background: #000;
        }

        canvas {
            display: block;
            border-radius: 8px;
            background-color: #05050d;
        }

        .controls-info {
            margin-top: 10px;
            color: #94a3b8;
            font-size: 0.85rem;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <canvas id="gameCanvas" width="640" height="480"></canvas>
</div>
<div class="controls-info">
    🕹️ <b>Teclado:</b> Flechas / WASD para moverte | <b>Espacio:</b> Disparar<br>
    📱 <b>Táctil:</b> Desliza en cualquier parte para moverte (con offset para no tapar tu personaje)
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// --- SINTETIZADOR DE AUDIO REAL-TIME (Web Audio API) ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSfx(type) {
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'shoot') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'hit') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'damage') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.linearRampToValueAtTime(40, now + 0.2);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'win') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.setValueAtTime(554, now + 0.1);
            osc.frequency.setValueAtTime(659, now + 0.2);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
        }
    } catch(e){}
}

// --- ESTADO GENERAL Y JUICINESS ---
let currentLevel = 0;
let score = 0;
let hp = 100;
let gameOver = false;
let gameWin = false;

let screenShake = 0;
let particles = [];
let floaters = [];
let stars = Array.from({length: 40}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    speed: Math.random() * 2 + 0.5,
    size: Math.random() * 2 + 1
}));

// --- CONTROLES MÓVILES Y TECLADO ---
const keys = {};
let touchStartPos = null;
let playerTouchStart = null;

window.addEventListener("keydown", e => {
    initAudio();
    keys[e.code] = true;
});
window.addEventListener("keyup", e => keys[e.code] = false);

canvas.addEventListener("touchstart", e => {
    initAudio();
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const t = e.touches[0];
    touchStartPos = { x: t.clientX - rect.left, y: t.clientY - rect.top };
    playerTouchStart = { x: getCurrentPlayer().x, y: getCurrentPlayer().y };
});

canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    if (!touchStartPos || !playerTouchStart) return;
    const rect = canvas.getBoundingClientRect();
    const t = e.touches[0];
    const currentTouch = { x: t.clientX - rect.left, y: t.clientY - rect.top };
    const dx = currentTouch.x - touchStartPos.x;
    const dy = currentTouch.y - touchStartPos.y;
    
    let p = getCurrentPlayer();
    if (p) {
        p.x = playerTouchStart.x + dx;
        p.y = playerTouchStart.y + dy;
    }
});

canvas.addEventListener("touchend", () => {
    touchStartPos = null;
    playerTouchStart = null;
});

// --- PARTICULAS Y TEXTO FLOTANTE ---
function addExplosion(x, y, color, count = 15) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color,
            life: 1,
            decay: Math.random() * 0.05 + 0.02,
            size: Math.random() * 4 + 2
        });
    }
}

function addFloatingText(text, x, y, color) {
    floaters.push({ text, x, y, color, life: 1, vy: -1.5 });
}

function triggerDamage(amount) {
    hp -= amount;
    screenShake = 12;
    playSfx('damage');
    if (hp <= 0) {
        hp = 0;
        gameOver = true;
    }
}

// --- ENTIDADES DE NIVELES ---

// Nivel 1: Undertale Dodge
let p1 = { x: 320, y: 380, vx: 0, vy: 0 };
let bullets1 = [
    { x: 220, y: 280, vx: 2.5, vy: 2 },
    { x: 420, y: 280, vx: -2, vy: 2.5 },
    { x: 320, y: 220, vx: 3, vy: -1.5 }
];
let targets1 = [
    { text: "Navegador Web", correct: true, x: 180, y: 110, w: 130, h: 40 },
    { text: "Procesador Texto", correct: false, x: 330, y: 110, w: 130, h: 40 },
    { text: "Hoja de Cálculo", correct: false, x: 180, y: 170, w: 130, h: 40 },
    { text: "Antivirus", correct: false, x: 330, y: 170, w: 130, h: 40 }
];

// Nivel 2: Space Shooter
let p2 = { x: 320, y: 420 };
let laserBullets = [];
let lastShot = 0;
let targets2 = [
    { text: "RAM", correct: false, x: 60, y: 100, vx: 2.5 },
    { text: "La Nube", correct: true, x: 200, y: 100, vx: 2.5 },
    { text: "Cable", correct: false, x: 340, y: 100, vx: 2.5 },
    { text: "Papelera", correct: false, x: 480, y: 100, vx: 2.5 }
];

// Nivel 3: Cyber Maze / Stealth
let p3 = { x: 320, y: 430 };
let hackers = [
    { x: 150, y: 220, vx: 4 },
    { x: 490, y: 300, vx: -5 },
    { x: 250, y: 140, vx: 3.5 }
];
let doors = [
    { text: "123456", correct: false, x: 100, y: 60, w: 110, h: 40 },
    { text: "Xk9#mP$2!vQ", correct: true, x: 265, y: 60, w: 110, h: 40 },
    { text: "password", correct: false, x: 430, y: 60, w: 110, h: 40 }
];

// Nivel 4: Catch Hardware
let p4 = { x: 320, y: 420, w: 70, h: 14 };
let caughtHardware = 0;
let fallingItems = [];
let spawnTimer = 0;

// Nivel 5: Boss Wi-Fi Bullet Hell
let p5 = { x: 320, y: 400 };
let wifiWaves = [];
let wifiTimer = 0;

function getCurrentPlayer() {
    if (currentLevel === 0) return p1;
    if (currentLevel === 1) return p2;
    if (currentLevel === 2) return p3;
    if (currentLevel === 3) return p4;
    if (currentLevel === 4) return p5;
    return null;
}

function nextLevel() {
    playSfx('win');
    addExplosion(canvas.width/2, canvas.height/2, "#00f0ff", 30);
    addFloatingText("¡NIVEL COMPLETADO! +100", canvas.width/2 - 90, 200, "#00f0ff");
    score += 100;
    currentLevel++;
    if (currentLevel >= 5) gameWin = true;
}

function resetGame() {
    currentLevel = 0;
    score = 0;
    hp = 100;
    gameOver = false;
    gameWin = false;
    caughtHardware = 0;
    p1.x = 320; p1.y = 380;
    p2.x = 320;
    p3.x = 320; p3.y = 430;
    p4.x = 320;
    p5.x = 320; p5.y = 400;
}

// --- BUCLE PRINCIPAL ---
function gameLoop() {
    // Screen Shake
    ctx.save();
    if (screenShake > 0) {
        let rx = (Math.random() - 0.5) * screenShake;
        let ry = (Math.random() - 0.5) * screenShake;
        ctx.translate(rx, ry);
        screenShake *= 0.85;
        if (screenShake < 0.5) screenShake = 0;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Fondo de Estrellas Retro
    ctx.fillStyle = "#ffffff";
    stars.forEach(s => {
        s.y += s.speed;
        if (s.y > canvas.height) s.y = 0;
        ctx.globalAlpha = Math.random() * 0.5 + 0.3;
        ctx.fillRect(s.x, s.y, s.size, s.size);
    });
    ctx.globalAlpha = 1.0;

    if (gameOver) {
        drawCenterText("¡GAME OVER!", "#ff0055", 36, -20);
        drawCenterText("Presiona Espacio o Toca para Reiniciar", "#ffffff", 16, 30);
        if (keys["Space"]) resetGame();
    } else if (gameWin) {
        drawCenterText("¡ERES UN CRACK DE LA TECNOLOGÍA!", "#00ff66", 26, -30);
        drawCenterText("Puntuación Final: " + score + " pts", "#00f0ff", 20, 10);
        drawCenterText("Presiona Espacio o Toca para Jugar de nuevo", "#ffffff", 15, 60);
        if (keys["Space"]) resetGame();
    } else {
        drawHUD();
        if (currentLevel === 0) playLevel1();
        else if (currentLevel === 1) playLevel2();
        else if (currentLevel === 2) playLevel3();
        else if (currentLevel === 3) playLevel4();
        else if (currentLevel === 4) playLevel5();

        updateParticles();
        updateFloaters();
    }

    ctx.restore();
    requestAnimationFrame(gameLoop);
}

// --- LÓGICA DETALLADA DE NIVELES ---

// LEVEL 1: UNDERTALE BOX
function playLevel1() {
    drawText("NIVEL 1: Entra en la opción correcta. ¡Esquiva los ataques!", 15, 65, 13, "#ffcc00");

    // Caja Undertale
    const box = { x: 160, y: 220, w: 320, h: 200 };
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 4;
    ctx.strokeRect(box.x, box.y, box.w, box.h);

    // Movimiento
    moveSmooth(p1, 3.5);
    p1.x = Math.max(box.x + 12, Math.min(box.x + box.w - 12, p1.x));
    p1.y = Math.max(box.y + 12, Math.min(box.y + box.h - 12, p1.y));

    // Dibujar Corazón Undertale
    drawHeart(p1.x, p1.y, 10, "#ff0055");

    // Proyectiles
    bullets1.forEach(b => {
        b.x += b.vx;
        b.y += b.vy;
        if (b.x < box.x + 8 || b.x > box.x + box.w - 8) b.vx *= -1;
        if (b.y < box.y + 8 || b.y > box.y + box.h - 8) b.vy *= -1;

        ctx.fillStyle = "#ffcc00";
        ctx.beginPath();
        ctx.arc(b.x, b.y, 6, 0, Math.PI * 2);
        ctx.fill();

        if (Math.hypot(p1.x - b.x, p1.y - b.y) < 14) {
            triggerDamage(1.2);
            addExplosion(b.x, b.y, "#ffcc00", 4);
        }
    });

    // Opciones arriba de la caja
    targets1.forEach(t => {
        ctx.fillStyle = "#1e1b4b";
        ctx.fillRect(t.x, t.y, t.w, t.h);
        ctx.strokeStyle = "#00f0ff";
        ctx.lineWidth = 2;
        ctx.strokeRect(t.x, t.y, t.w, t.h);
        drawText(t.text, t.x + 8, t.y + 24, 11, "#ffffff");

        // Si el jugador rompe el borde superior de la caja alineado a una opción
        if (p1.y <= box.y + 15 && p1.x > t.x && p1.x < t.x + t.w) {
            if (t.correct) {
                nextLevel();
            } else {
                triggerDamage(20);
                addFloatingText("-20 HP Incorrecto", p1.x - 40, p1.y, "#ff0055");
                p1.y += 50;
            }
        }
    });
}

// LEVEL 2: SPACE SHOOTER
function playLevel2() {
    drawText("NIVEL 2: ¡Dispara a la opción de guardado remoto!", 15, 65, 13, "#ffcc00");

    if (keys["ArrowLeft"] || keys["KeyA"]) p2.x -= 5;
    if (keys["ArrowRight"] || keys["KeyD"]) p2.x += 5;
    p2.x = Math.max(30, Math.min(canvas.width - 30, p2.x));

    // Nave Estilo Arcade
    ctx.fillStyle = "#00f0ff";
    ctx.beginPath();
    ctx.moveTo(p2.x, p2.y - 15);
    ctx.lineTo(p2.x - 15, p2.y + 10);
    ctx.lineTo(p2.x + 15, p2.y + 10);
    ctx.closePath();
    ctx.fill();

    // Disparo
    if ((keys["Space"] || keys["ArrowUp"] || keys["KeyW"]) && Date.now() - lastShot > 200) {
        laserBullets.push({ x: p2.x, y: p2.y - 15 });
        playSfx('shoot');
        lastShot = Date.now();
    }

    laserBullets.forEach((b, index) => {
        b.y -= 8;
        ctx.fillStyle = "#ff0055";
        ctx.fillRect(b.x - 2, b.y, 4, 12);

        targets2.forEach(t => {
            if (b.x > t.x && b.x < t.x + 90 && b.y > t.y && b.y < t.y + 35) {
                laserBullets.splice(index, 1);
                addExplosion(b.x, b.y, "#ff0055", 10);
                if (t.correct) {
                    nextLevel();
                } else {
                    triggerDamage(15);
                    addFloatingText("¡Esa no es la respuesta!", t.x, t.y + 40, "#ff0055");
                }
            }
        });
    });

    // Enemigos en movimiento
    targets2.forEach(t => {
        t.x += t.vx;
        if (t.x < 10 || t.x > canvas.width - 100) t.vx *= -1;
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(t.x, t.y, 90, 35);
        ctx.strokeStyle = "#a855f7";
        ctx.lineWidth = 2;
        ctx.strokeRect(t.x, t.y, 90, 35);
        drawText(t.text, t.x + 10, t.y + 22, 12, "#ffffff");
    });
}

// LEVEL 3: STEALTH
function playLevel3() {
    drawText("NIVEL 3: Esquiva a los Hackers y entra a la Clave Segura", 15, 65, 13, "#ffcc00");

    moveSmooth(p3, 3.5);
    p3.x = Math.max(20, Math.min(canvas.width - 20, p3.x));
    p3.y = Math.max(60, Math.min(canvas.height - 20, p3.y));

    // Jugador (Cyber Orb)
    ctx.fillStyle = "#00ff66";
    ctx.beginPath();
    ctx.arc(p3.x, p3.y, 10, 0, Math.PI * 2);
    ctx.fill();

    // Hackers Patrol
    hackers.forEach(h => {
        h.x += h.vx;
        if (h.x < 40 || h.x > canvas.width - 40) h.vx *= -1;

        // Laser de escaneo
        ctx.strokeStyle = "rgba(255, 0, 85, 0.25)";
        ctx.lineWidth = 12;
        ctx.beginPath();
        ctx.moveTo(h.x, h.y - 10);
        ctx.lineTo(h.x, h.y + 10);
        ctx.stroke();

        drawText("👾", h.x - 12, h.y + 8, 22, "#ff0055");

        if (Math.hypot(p3.x - h.x, p3.y - h.y) < 22) {
            triggerDamage(2.5);
            addExplosion(p3.x, p3.y, "#ff0055", 3);
            p3.y += 25;
        }
    });

    // Puertas
    doors.forEach(d => {
        ctx.fillStyle = "#022c22";
        ctx.fillRect(d.x, d.y, d.w, d.h);
        ctx.strokeStyle = "#00ff66";
        ctx.lineWidth = 2;
        ctx.strokeRect(d.x, d.y, d.w, d.h);
        drawText(d.text, d.x + 8, d.y + 24, 11, "#ffffff");

        if (p3.x > d.x && p3.x < d.x + d.w && p3.y > d.y && p3.y < d.y + d.h) {
            if (d.correct) {
                nextLevel();
            } else {
                triggerDamage(20);
                addFloatingText("¡Insegura!", d.x, d.y + 50, "#ff0055");
                p3.y = 430;
            }
        }
    });
}

// LEVEL 4: CATCH HARDWARE
function playLevel4() {
    drawText(`NIVEL 4: Atrapa 3 componentes de HARDWARE (${caughtHardware}/3)`, 15, 65, 13, "#ffcc00");

    if (keys["ArrowLeft"] || keys["KeyA"]) p4.x -= 6;
    if (keys["ArrowRight"] || keys["KeyD"]) p4.x += 6;
    p4.x = Math.max(p4.w/2, Math.min(canvas.width - p4.w/2, p4.x));

    // Base Atrapadora
    ctx.fillStyle = "#00f0ff";
    ctx.fillRect(p4.x - p4.w/2, p4.y, p4.w, p4.h);

    spawnTimer++;
    if (spawnTimer % 35 === 0) {
        const isHw = Math.random() > 0.45;
        const hwList = ["Teclado ⌨️", "Ratón 🖱️", "Monitor 🖥️"];
        const swList = ["Virus 🦠", "Photoshop 🎨", "Windows 🪟"];
        fallingItems.push({
            x: Math.random() * (canvas.width - 120) + 60,
            y: 70,
            isHardware: isHw,
            text: isHw ? hwList[Math.floor(Math.random() * hwList.length)] : swList[Math.floor(Math.random() * swList.length)]
        });
    }

    fallingItems.forEach((item, index) => {
        item.y += 3.8;
        drawText(item.text, item.x - 20, item.y, 12, item.isHardware ? "#00ff66" : "#ff0055");

        if (item.y >= p4.y - 10 && item.y <= p4.y + p4.h && Math.abs(item.x - p4.x) < p4.w/2 + 15) {
            fallingItems.splice(index, 1);
            if (item.isHardware) {
                caughtHardware++;
                playSfx('hit');
                addExplosion(item.x, item.y, "#00ff66", 8);
                if (caughtHardware >= 3) nextLevel();
            } else {
                triggerDamage(15);
                addFloatingText("¡Eso es Software!", p4.x - 40, p4.y - 20, "#ff0055");
            }
        }
    });
}

// LEVEL 5: BOSS BULLET HELL
function playLevel5() {
    drawText("NIVEL FINAL: ¡Esquiva las ondas Wi-Fi y llega al Router!", 15, 65, 13, "#ffcc00");

    moveSmooth(p5, 3.5);
    p5.x = Math.max(30, Math.min(canvas.width - 30, p5.x));
    p5.y = Math.max(80, Math.min(canvas.height - 30, p5.y));

    // Corazón Soul
    drawHeart(p5.x, p5.y, 10, "#00f0ff");

    // Boss Router
    drawText("📶 ROUTER WI-FI", canvas.width/2 - 60, 100, 16, "#00ff66");
    if (Math.hypot(p5.x - canvas.width/2, p5.y - 95) < 35) nextLevel();

    wifiTimer++;
    if (wifiTimer % 22 === 0) {
        wifiWaves.push({ x: canvas.width/2, y: 95, r: 10 });
    }

    wifiWaves.forEach((w, index) => {
        w.r += 3.2;
        ctx.strokeStyle = "#ff0055";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2);
        ctx.stroke();

        const d = Math.hypot(p5.x - w.x, p5.y - w.y);
        if (Math.abs(d - w.r) < 8) {
            triggerDamage(1.5);
            addExplosion(p5.x, p5.y, "#ff0055", 2);
        }

        if (w.r > 450) wifiWaves.splice(index, 1);
    });
}

// --- UTILS & RENDERING ---

function moveSmooth(p, speed) {
    if (keys["ArrowLeft"] || keys["KeyA"]) p.x -= speed;
    if (keys["ArrowRight"] || keys["KeyD"]) p.x += speed;
    if (keys["ArrowUp"] || keys["KeyW"]) p.y -= speed;
    if (keys["ArrowDown"] || keys["KeyS"]) p.y += speed;
}

function drawHeart(x, y, size, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x - size/2, y - size/2, size/2, Math.PI, 0, false);
    ctx.arc(x + size/2, y - size/2, size/2, Math.PI, 0, false);
    ctx.lineTo(x, y + size);
    ctx.closePath();
    ctx.fill();
}

function updateParticles() {
    particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;
        if (p.life <= 0) {
            particles.splice(index, 1);
        } else {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.fillRect(p.x, p.y, p.size, p.size);
        }
    });
    ctx.globalAlpha = 1.0;
}

function updateFloaters() {
    floaters.forEach((f, index) => {
        f.y += f.vy;
        f.life -= 0.02;
        if (f.life <= 0) {
            floaters.splice(index, 1);
        } else {
            drawText(f.text, f.x, f.y, 13, f.color);
        }
    });
}

function drawHUD() {
    ctx.fillStyle = "#090d16";
    ctx.fillRect(0, 0, canvas.width, 45);

    // Barra de Vida Animada
    ctx.fillStyle = "#334155";
    ctx.fillRect(15, 12, 120, 16);
    ctx.fillStyle = hp > 35 ? "#00ff66" : "#ff0055";
    ctx.fillRect(15, 12, (hp / 100) * 120, 16);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1;
    ctx.strokeRect(15, 12, 120, 16);

    drawText("HP: " + Math.ceil(hp), 20, 25, 11, "#000000");
    drawText("SCORE: " + score, canvas.width - 130, 26, 14, "#00f0ff");
}

function drawText(text, x, y, size, color) {
    ctx.fillStyle = color;
    ctx.font = `bold ${size}px 'Courier New', monospace`;
    ctx.fillText(text, x, y);
}

function drawCenterText(text, color, size, offsetY = 0) {
    ctx.fillStyle = color;
    ctx.font = `bold ${size}px 'Courier New', monospace`;
    ctx.textAlign = "center";
    ctx.fillText(text, canvas.width / 2, canvas.height / 2 + offsetY);
    ctx.textAlign = "start";
}

requestAnimationFrame(gameLoop);
</script>
</body>
