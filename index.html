<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafío Cyber-Tech</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* CARD DE INTERFAZ GENERAL */
        .card {
            background: #1e293b;
            border: 2px solid #38bdf8;
            border-radius: 16px;
            padding: 30px;
            max-width: 550px;
            width: 90%;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);
            text-align: center;
            position: relative;
            z-index: 10;
            transition: all 0.3s ease;
        }

        h1, h2 {
            color: #38bdf8;
            margin-bottom: 15px;
        }

        p {
            margin-bottom: 20px;
            color: #cbd5e1;
            line-height: 1.5;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 2px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 20px;
            outline: none;
            text-align: center;
        }

        input[type="text"]:focus {
            border-color: #38bdf8;
        }

        .btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        .btn:hover {
            background: #0369a1;
        }

        .btn:active {
            transform: scale(0.96);
        }

        /* OPCIONES DE PREGUNTAS NORMALES */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: #334155;
            color: #fff;
            border: 2px solid transparent;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            text-align: left;
            transition: background 0.2s;
        }

        .option-btn:hover {
            background: #475569;
            border-color: #38bdf8;
        }

        /* EFECTO COLAPSO / GLITCH */
        .glitch-active {
            animation: shakeGlitch 0.5s infinite;
            filter: invert(1) hue-rotate(180deg);
        }

        @keyframes shakeGlitch {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-10px, 10px) rotate(-2deg); }
            40% { transform: translate(10px, -5px) rotate(2deg); }
            60% { transform: translate(-15px, -10px) rotate(-1deg); }
            80% { transform: translate(15px, 10px) rotate(3deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* CANVAS DE SPACE INVADERS */
        #gameCanvas {
            display: none;
            border: 3px solid #00ff66;
            border-radius: 10px;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.4);
            max-width: 100%;
        }

        /* VENTANAS POP-UP DE ESTAFAS */
        .popup-window {
            position: absolute;
            width: 260px;
            background: #e2e8f0;
            color: #0f172a;
            border: 3px solid #ef4444;
            border-radius: 6px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            z-index: 100;
            animation: popupBounce 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: Arial, sans-serif;
        }

        .popup-header {
            background: #ef4444;
            color: white;
            padding: 5px 10px;
            font-weight: bold;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .popup-body {
            padding: 12px;
            font-size: 0.85rem;
            text-align: center;
        }

        .popup-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 8px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        @keyframes popupBounce {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* CONTENEDOR DE ENCUESTA FINAL */
        .feedback-box {
            position: relative;
            min-height: 180px;
            width: 100%;
            margin-top: 20px;
        }

        #btnNo {
            position: absolute;
            background: #ef4444;
            transition: left 0.15s ease, top 0.15s ease;
        }

        #btnSi {
            background: #22c55e;
            margin-right: 15px;
        }
    </style>
</head>
<body>

<!-- 1. REGISTRO INICIAL -->
<div class="card" id="welcomeCard">
    <h1>👾 Misión Tecnología</h1>
    <p>Ingresa tu nombre o el de tu equipo para comenzar el test:</p>
    <input type="text" id="playerName" placeholder="Nombre / Equipo" maxlength="20" autocomplete="off">
    <button class="btn" onclick="startQuiz()">Comenzar Test ➔</button>
</div>

<!-- 2. PREGUNTA NORMAL -->
<div class="card" id="quizCard" style="display: none;">
    <h2 id="questionTitle">Pregunta 1 de 1</h2>
    <p id="questionText">¿Qué significa la sigla 'HTML' en tecnología?</p>
    <div class="options-list">
        <button class="option-btn" onclick="triggerGlitch()">A) HyperText Markup Language</button>
        <option class="option-btn" onclick="triggerGlitch()" style="display:block;">B) High Technical Machine Language</option>
        <button class="option-btn" onclick="triggerGlitch()">C) Home Tool Media Level</button>
    </div>
</div>

<!-- 3. SPACE INVADERS MINIJUEGO -->
<canvas id="gameCanvas" width="550" height="400"></canvas>

<!-- 4. PANTALLA FINAL CON BOTÓN ESCAPISTA -->
<div class="card" id="finalCard" style="display: none;">
    <h2>🎉 ¡Felicidades <span id="finalPlayerName" style="color: #38bdf8;"></span>!</h2>
    <p>Derrotaste al virus informático y bloqueaste los ataques de phishing/estafas.</p>
    <hr style="border-color: #334155; margin: 15px 0;">
    <h3>¿Te gustó la prueba?</h3>
    
    <div class="feedback-box" id="feedbackArea">
        <button class="btn" id="btnSi" onclick="confirmYes()">¡SÍ! ❤️</button>
        <button class="btn" id="btnNo">No 👎</button>
    </div>
</div>

<script>
// --- SINTETIZADOR DE SONIDOS (Web Audio API) ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playSound(type) {
    if (!audioCtx) audioCtx = new AudioContext();
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'shoot') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'glitch') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.linearRampToValueAtTime(60, now + 0.4);
            gain.gain.setValueAtTime(0.3, now);
            osc.start(now); osc.stop(now + 0.4);
        } else if (type === 'pop') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.setValueAtTime(1200, now + 0.05);
            gain.gain.setValueAtTime(0.15, now);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'dodge') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
            gain.gain.setValueAtTime(0.1, now);
            osc.start(now); osc.stop(now + 0.08);
        }
    } catch(e){}
}

// --- VARIABLES DE ESTADO ---
let playerName = "";
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

function startQuiz() {
    const input = document.getElementById("playerName").value.trim();
    playerName = input !== "" ? input : "Jugador";
    document.getElementById("welcomeCard").style.display = "none";
    document.getElementById("quizCard").style.display = "block";
}

// --- PASO 2 Y 3: CAÍDA DE LA PÁGINA Y SPACE INVADERS ---
function triggerGlitch() {
    playSound('glitch');
    const quizCard = document.getElementById("quizCard");
    quizCard.classList.add("glitch-active");

    setTimeout(() => {
        quizCard.style.display = "none";
        quizCard.classList.remove("glitch-active");
        canvas.style.display = "block";
        initSpaceInvaders();
    }, 800);
}

// LÓGICA DE SPACE INVADERS
let player = { x: 250, y: 360, w: 40, h: 15 };
let lasers = [];
let viruses = [];
let invaderDirection = 1;
let invaderSpeed = 1.2;
let gameInterval = null;

function initSpaceInvaders() {
    viruses = [];
    lasers = [];
    // Crear rejilla de virus (Space Invaders)
    for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 6; c++) {
            viruses.push({
                x: 60 + c * 70,
                y: 50 + r * 40,
                w: 30,
                h: 25,
                alive: true
            });
        }
    }

    // Eventos de control teclado y táctil
    window.addEventListener("keydown", handleKey);
    canvas.addEventListener("mousemove", handleMouse);
    canvas.addEventListener("click", fireLaser);
    canvas.addEventListener("touchstart", handleTouchFire);

    gameInterval = requestAnimationFrame(updateInvaders);
}

function handleKey(e) {
    if (e.code === "ArrowLeft" || e.code === "KeyA") player.x -= 20;
    if (e.code === "ArrowRight" || e.code === "KeyD") player.x += 20;
    if (e.code === "Space") fireLaser();
    player.x = Math.max(10, Math.min(canvas.width - player.w - 10, player.x));
}

function handleMouse(e) {
    const rect = canvas.getBoundingClientRect();
    player.x = e.clientX - rect.left - player.w / 2;
    player.x = Math.max(10, Math.min(canvas.width - player.w - 10, player.x));
}

function handleTouchFire(e) {
    e.preventDefault();
    fireLaser();
}

function fireLaser() {
    lasers.push({ x: player.x + player.w / 2 - 2, y: player.y, w: 4, h: 12 });
    playSound('shoot');
}

function updateInvaders() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Texto instructivo arriba
    ctx.fillStyle = "#00ff66";
    ctx.font = "bold 14px Arial";
    ctx.fillText("⚠️ ¡VIRUS DETECTADO! ¡ELIMÍNALOS A TODOS!", 110, 25);

    // Dibujar Jugador
    ctx.fillStyle = "#38bdf8";
    ctx.fillRect(player.x, player.y, player.w, player.h);
    ctx.fillRect(player.x + 15, player.y - 8, 10, 8);

    // Actualizar y Dibujar Láseres
    ctx.fillStyle = "#ff0055";
    lasers.forEach((l, index) => {
        l.y -= 7;
        ctx.fillRect(l.x, l.y, l.w, l.h);

        // Colisión con Virus
        viruses.forEach(v => {
            if (v.alive && l.x > v.x && l.x < v.x + v.w && l.y > v.y && l.y < v.y + v.h) {
                v.alive = false;
                lasers.splice(index, 1);
            }
        });

        if (l.y < 0) lasers.splice(index, 1);
    });

    // Mover y Dibujar Virus
    let changeDir = false;
    let aliveCount = 0;

    viruses.forEach(v => {
        if (!v.alive) return;
        aliveCount++;
        v.x += invaderSpeed * invaderDirection;

        if (v.x > canvas.width - 40 || v.x < 10) changeDir = true;

        // Dibujo de Virus Retro
        ctx.fillStyle = "#ef4444";
        ctx.fillRect(v.x, v.y, v.w, v.h);
        ctx.fillStyle = "#000";
        ctx.fillRect(v.x + 5, v.y + 5, 5, 5);
        ctx.fillRect(v.x + 20, v.y + 5, 5, 5);
    });

    if (changeDir) {
        invaderDirection *= -1;
        viruses.forEach(v => v.y += 10);
    }

    // Condición de Victoria
    if (aliveCount === 0) {
        canvas.style.display = "none";
        triggerPopups(); // Pasar a la fase de Pop-ups de estafas
        return;
    }

    requestAnimationFrame(updateInvaders);
}

// --- PASO 4: PANTALLAS EMERGENTES (ANTI-ESTAFAS) ---
const scamMessages = [
    "⚠️ ¡GANASTE UN IPHONE 17 PRO! Haz clic aquí para reclamar.",
    "🚨 Su cuenta de banco ha sido SUSPENDIDA. Ingrese su clave.",
    "💰 ¡Transferencia pendiente de $5,000 USD! Verifique CBU.",
    "👾 99 Virus detectados en su dispositivo. Descargue AntivirusPro.exe"
];

function triggerPopups() {
    let popupCount = 0;
    const maxPopups = 6;

    const interval = setInterval(() => {
        playSound('pop');
        createPopup(scamMessages[popupCount % scamMessages.length]);
        popupCount++;

        if (popupCount >= maxPopups) {
            clearInterval(interval);
            // Esperar unos segundos y limpiar la pantalla automáticamente
            setTimeout(() => {
                document.querySelectorAll('.popup-window').forEach(p => p.remove());
                showFinalScreen();
            }, 3500);
        }
    }, 400);
}

function createPopup(text) {
    const pop = document.createElement("div");
    pop.className = "popup-window";
    
    // Posición aleatoria en pantalla
    const randomX = Math.floor(Math.random() * (window.innerWidth - 280));
    const randomY = Math.floor(Math.random() * (window.innerHeight - 150));
    pop.style.left = `${Math.max(10, randomX)}px`;
    pop.style.top = `${Math.max(10, randomY)}px`;

    pop.innerHTML = `
        <div class="popup-header">
            <span>⚠️ ALERTA DE SEGURIDAD</span>
            <span style="cursor:pointer;" onclick="this.parentElement.parentElement.remove()">✕</span>
        </div>
        <div class="popup-body">
            <p style="color:#0f172a; margin-bottom:5px;">${text}</p>
            <button class="popup-btn" onclick="this.parentElement.parentElement.remove()">CERRAR / BLOQUEAR</button>
        </div>
    `;

    document.body.appendChild(pop);
}

// --- PASO 5: PANTALLA FINAL Y BOTÓN "NO" ESCAPISTA ---
function showFinalScreen() {
    document.getElementById("finalPlayerName").innerText = playerName;
    document.getElementById("finalCard").style.display = "block";
    setupEvasiveButton();
}

function setupEvasiveButton() {
    const btnNo = document.getElementById("btnNo");
    const container = document.getElementById("feedbackArea");

    // Posición inicial del botón No
    btnNo.style.left = "180px";
    btnNo.style.top = "10px";

    function moveNoButton() {
        playSound('dodge');
        const containerRect = container.getBoundingClientRect();
        const btnRect = btnNo.getBoundingClientRect();

        const maxX = containerRect.width - btnRect.width - 20;
        const maxY = containerRect.height - btnRect.height - 20;

        const newX = Math.max(10, Math.floor(Math.random() * maxX));
        const newY = Math.max(10, Math.floor(Math.random() * maxY));

        btnNo.style.left = `${newX}px`;
        btnNo.style.top = `${newY}px`;
    }

    btnNo.addEventListener("mouseover", moveNoButton);
    btnNo.addEventListener("touchstart", (e) => {
        e.preventDefault();
        moveNoButton();
    });
}

function confirmYes() {
    alert(`¡Gracias por tu respuesta, ${playerName}! 🎉 ¡Has completado con éxito la prueba tecno-gamer!`);
}
</script>
</body>
</html>
