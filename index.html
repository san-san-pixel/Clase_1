<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión Tecnología - El Juego</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-card {
            background-color: #1e293b;
            border: 2px solid #38bdf8;
            border-radius: 16px;
            padding: 25px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.2);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }

        .level-badge {
            background-color: #0284c7;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .score-board {
            color: #38bdf8;
            font-weight: bold;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #334155;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: #38bdf8;
            width: 20%;
            transition: width 0.3s ease;
        }

        .question-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: #334155;
            color: #f8fafc;
            border: 2px solid transparent;
            padding: 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            text-align: left;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background-color: #475569;
            border-color: #38bdf8;
        }

        .option-btn.correct {
            background-color: #15803d !important;
            border-color: #22c55e !important;
        }

        .option-btn.wrong {
            background-color: #b91c1c !important;
            border-color: #ef4444 !important;
        }

        .feedback {
            min-height: 50px;
            font-size: 0.95rem;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct-bg {
            background-color: rgba(34, 197, 94, 0.1);
            color: #4ade80;
        }

        .feedback.wrong-bg {
            background-color: rgba(239, 68, 68, 0.1);
            color: #f87171;
        }

        .action-btn {
            width: 100%;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        .action-btn:hover {
            background-color: #0369a1;
        }

        .result-screen {
            text-align: center;
            padding: 20px 0;
        }

        .result-screen h2 {
            font-size: 2rem;
            color: #38bdf8;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="game-card">
    <div id="game-ui">
        <div class="header">
            <span class="level-badge" id="level-badge">Nivel 1/5</span>
            <span class="score-board">Puntos: <span id="score">0</span></span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="question-title" id="question-text">Cargando misión...</div>
        <div class="options-grid" id="options-container"></div>
        <div class="feedback" id="feedback"></div>
        <button class="action-btn" id="next-btn" onclick="nextQuestion()">Siguiente Nivel ➔</button>
    </div>

    <div id="result-screen" class="result-screen" style="display: none;">
        <h2>¡Misión Completada! 🎮</h2>
        <p style="margin-bottom: 20px; font-size: 1.2rem;">Tu puntuación final es: <strong id="final-score" style="color: #38bdf8;">0</strong> / 500</p>
        <button class="action-btn" style="display: block;" onclick="restartGame()">Jugar de Nuevo</button>
    </div>
</div>

<script>
    const questions = [
        {
            level: "Nivel 1: El Explorador Web",
            question: "🎮 Misión: Quieres navegar por Internet para ver videos y leer noticias. ¿Qué herramienta debes ejecutar?",
            options: [
                { text: "Un navegador web", correct: true, info: "¡Correcto! Chrome, Firefox o Edge son navegadores web." },
                { text: "Un procesador de texto", correct: false, info: "Incorrecto. Eso sirve para redactar documentos." },
                { text: "Una hoja de cálculo", correct: false, info: "Incorrecto. Eso se usa para cuentas y tablas." },
                { text: "Un antivirus", correct: false, info: "Incorrecto. Eso sirve para desinfectar el sistema." }
            ]
        },
        {
            level: "Nivel 2: Desafío de Almacenamiento",
            question: "☁️ Misión: Te quedaste sin espacio local. ¿Dónde guardas tus archivos para acceder desde cualquier parte?",
            options: [
                { text: "Memoria de la pantalla", correct: false, info: "Incorrecto. El monitor solo muestra imagen." },
                { text: "Almacenamiento en la nube", correct: true, info: "¡Excelente! La nube guarda tus datos en servidores remotos." },
                { text: "Cable de red", correct: false, info: "Incorrecto. Los cables transmiten datos, no los guardan." },
                { text: "Papelera de reciclaje", correct: false, info: "Incorrecto. Ahí se envían los archivos a borrar." }
            ]
        },
        {
            level: "Nivel 3: Escudo Anti-Hackers",
            question: "🛡️ Misión: Un hacker intenta entrar a tu cuenta. ¿Cuál es la contraseña más segura?",
            options: [
                { text: "123456", correct: false, info: "Incorrecto. Es la clave más fácil de adivinar." },
                { text: "password", correct: false, info: "Incorrecto. Usar palabras comunes es muy riesgoso." },
                { text: "Xk9#mP$2!vQ", correct: true, info: "¡Poderoso escudo! Mezcla símbolos, números y mayúsculas." },
                { text: "MiNombre2026", correct: false, info: "Incorrecto. Datos personales son fáciles de deducir." }
            ]
        },
        {
            level: "Nivel 4: Detective de Componentes",
            question: "🖥️ Misión: Puedes tocar físicamente el teclado, el ratón y la pantalla. ¿Cómo se llama esta parte?",
            options: [
                { text: "Software", correct: false, info: "Incorrecto. El software son los programas intangibles." },
                { text: "Hardware", correct: true, info: "¡Correcto! El hardware representa la parte física." },
                { text: "Malware", correct: false, info: "Incorrecto. Eso es código malicioso o virus." },
                { text: "Freeware", correct: false, info: "Incorrecto. Se refiere a programas gratuitos." }
            ]
        },
        {
            level: "Nivel 5: La Señal Invisible",
            question: "📶 Misión: Llegas a una cafetería y necesitas conectar tu celular a Internet sin cables. ¿Qué usas?",
            options: [
                { text: "Red Wi-Fi", correct: true, info: "¡Victoria! El Wi-Fi transmite datos de forma inalámbrica." },
                { text: "Bluetooth", correct: false, info: "Incorrecto. Sirve para conectar accesorios cercanos." },
                { text: "Cable Ethernet", correct: false, info: "Incorrecto. Eso requiere una conexión física." },
                { text: "Puerto USB", correct: false, info: "Incorrecto. Es un conector físico de cables." }
            ]
        }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    function loadQuestion() {
        answered = false;
        const q = questions[currentQuestion];
        
        document.getElementById("level-badge").innerText = q.level;
        document.getElementById("question-text").innerText = q.question;
        document.getElementById("progress-fill").style.width = ((currentQuestion + 1) / questions.length) * 100 + "%";
        
        const feedback = document.getElementById("feedback");
        feedback.className = "feedback";
        feedback.innerText = "";
        
        document.getElementById("next-btn").style.display = "none";

        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";

        q.options.forEach(opt => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt.text;
            btn.onclick = () => selectOption(btn, opt);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(selectedBtn, option) {
        if (answered) return;
        answered = true;

        const feedback = document.getElementById("feedback");
        const buttons = document.querySelectorAll(".option-btn");

        buttons.forEach(btn => btn.style.cursor = "default");

        if (option.correct) {
            selectedBtn.classList.add("correct");
            score += 100;
            document.getElementById("score").innerText = score;
            feedback.innerText = option.info;
            feedback.classList.add("show", "correct-bg");
        } else {
            selectedBtn.classList.add("wrong");
            feedback.innerText = option.info;
            feedback.classList.add("show", "wrong-bg");
        }

        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        currentQuestion++;
        if (currentQuestion < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById("game-ui").style.display = "none";
        document.getElementById("result-screen").style.display = "block";
        document.getElementById("final-score").innerText = score;
    }

    function restartGame() {
        currentQuestion = 0;
        score = 0;
        document.getElementById("score").innerText = score;
        document.getElementById("result-screen").style.display = "none";
        document.getElementById("game-ui").style.display = "block";
        loadQuestion();
    }

    loadQuestion();
</script>
</body>
</html>
